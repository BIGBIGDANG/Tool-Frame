# Simulator defaults; policy architecture is read from the external checkpoint config.
physics_engine: physx
pipeline: gpu
sim_device: cuda:0
rl_device: cuda:0
graphics_device_id: 0
num_envs: 1
num_subscenes: 4
headless: true
task_name: SimToolReal
defaults:
  - task: SimToolRealLSTM
  - override hydra/job_logging: disabled
  - _self_
hydra:
  output_subdir: null
  run:
    dir: .
